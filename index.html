<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CorniSand</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0c;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: calc(100vh - 48px);
            touch-action: none;
        }

        #toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: rgba(16, 16, 20, 0.90);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tool-btn {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            color: #9ca3af;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #d1d5db;
        }

        .tool-btn.active,
        .tool-btn[aria-pressed="true"] {
            background: rgba(255, 255, 255, 0.12);
            color: #f3f4f6;
            border-color: rgba(255, 255, 255, 0.3);
        }

        [data-tip] {
            position: relative;
        }

        [data-tip]::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 10px);
            right: 0;
            padding: 4px 8px;
            background: rgba(16, 16, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: #f3f4f6;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 20;
        }

        [data-tip]:hover::after,
        [data-tip]:focus-visible::after,
        [data-tip].tip-visible::after {
            opacity: 1;
        }

        /* The element and tool buttons scroll sideways when they do not fit; the controls after them keep their places. */
        #tool-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        }

        #tool-buttons > * {
            flex-shrink: 0;
        }

        /* The grid size and the particle count give way, so the buttons keep room to scroll in. */
        @media (max-width: 1200px) {
            .narrow-hide {
                display: none;
            }
        }

        .separator {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .info-text {
            color: #6b7280;
            font-size: 12px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            white-space: nowrap;
        }

        /* Wide enough for the longest label and temperature, so the controls after it keep their places. */
        .probe-text {
            min-width: 17ch;
            color: #d1d5db;
        }

        #clear-btn {
            padding: 6px 16px;
            border: 1px solid rgba(239, 68, 68, 0.25);
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-left: auto;
            transition: all 0.15s ease;
        }

        #clear-btn:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        .heat-legend {
            position: fixed;
            bottom: 56px;
            right: 16px;
            width: 400px;
            padding: 8px 20px 6px;
            background: rgba(16, 16, 20, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            z-index: 10;
            pointer-events: none;
        }

        .heat-legend[hidden] {
            display: none;
        }

        .heat-legend-title {
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .heat-legend-bar {
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .heat-legend-labels {
            position: relative;
            height: 16px;
            margin-top: 3px;
            color: #d1d5db;
            font-size: 11px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }

        .heat-legend-labels span {
            position: absolute;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .help-hint {
            position: fixed;
            top: 12px;
            right: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            pointer-events: none;
            z-index: 10;
            text-align: right;
            line-height: 1.6;
            transition: opacity 2s ease;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="help-hint" id="help-hint">
        Left click: draw · Right click: erase<br>
        Scroll: brush size · <span id="tool-keys">1-6</span>: select tool · [/]: speed<br>
        Hold Shift: draw over existing particles (except walls)
    </div>

    <div class="heat-legend" id="heat-legend" hidden>
        <div class="heat-legend-title">Temperature (°C)</div>
        <div class="heat-legend-bar" id="heat-legend-bar"></div>
        <div class="heat-legend-labels" id="heat-legend-labels"></div>
    </div>

    <div id="toolbar">
        <div id="tool-buttons"></div>
        <div class="separator"></div>
        <span class="info-text probe-text" id="probe-info"></span>
        <div class="separator"></div>
        <span class="info-text" id="brush-size">Brush: 10</span>
        <div class="separator"></div>
        <span class="info-text" id="fps">-- FPS</span>
        <div class="separator"></div>
        <span class="info-text narrow-hide" id="grid-info">--</span>
        <div class="separator narrow-hide"></div>
        <span class="info-text narrow-hide" id="particle-count">0 particles</span>
        <div class="separator narrow-hide"></div>
        <button class="tool-btn" type="button" id="speed-down" aria-label="Slow down ([)" data-tip="Slow down ([)">&#x2039;</button>
        <span class="info-text" id="speed-display">Speed: 1x</span>
        <button class="tool-btn" type="button" id="speed-up" aria-label="Speed up (])" data-tip="Speed up (])">&#x203a;</button>
        <button id="clear-btn">Clear</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
