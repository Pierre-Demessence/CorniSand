<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CorniSand movement prototype</title>
    <link rel="icon" href="data:," />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0c;
            color: #d1d5db;
            font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 12px 16px;
        }

        #controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        button,
        select {
            padding: 6px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
            color: #e5e7eb;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }

        #halves {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 12px;
        }

        figure {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        figcaption {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        canvas {
            width: 100%;
            aspect-ratio: 2 / 1;
            image-rendering: pixelated;
            cursor: crosshair;
            touch-action: none;
        }
    </style>
</head>

<body>
    <div id="controls">
        <label>Scene
            <select id="scene">
                <option value="blast">Blast</option>
                <option value="pour">Pour</option>
                <option value="wind">Wind</option>
            </select>
        </label>
        <button id="reset" type="button">Reset</button>
        <span>Click either half to blast both at the same spot.</span>
    </div>
    <div id="halves">
        <figure>
            <figcaption><strong>A: every grain stays in the grid</strong><span id="stats-a"></span></figcaption>
            <canvas id="canvas-a"></canvas>
        </figure>
        <figure>
            <figcaption><strong>C: fast grains fly as particles</strong><span id="stats-c"></span></figcaption>
            <canvas id="canvas-c"></canvas>
        </figure>
    </div>
    <script type="module" src="/src/proto/main.ts"></script>
</body>

</html>
